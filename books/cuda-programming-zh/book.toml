[book]
title = "CUDA 编程：从并行模型到工程实践"
description = "一本围绕可运行程序和实测数据展开的中文 CUDA 教程：从第一个 kernel 到性能分析、异步执行、现代 GPU 协作机制、常用库、完整案例和系统层面的话题。"
authors = ["winterYANGWT"]
language = "zh-CN"
src = "src"

[output.html]
additional-css = ["theme/custom.css"]
git-repository-url = "https://github.com/winterYANGWT/Awesome-Tech-Books/tree/main/books/cuda-programming-zh"
no-section-label = true

[output.html.search]
use-boolean-and = true

