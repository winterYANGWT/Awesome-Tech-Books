apiVersion: v1
kind: ConfigMap
metadata:
  name: shorty-runtime
  namespace: shorty
data:
  GREETING: "hello-v1"
  app.properties: |
    mode=v1
    build=1
---
apiVersion: v1
kind: Pod
metadata:
  name: cm-dir
  namespace: shorty
  labels:
    app.kubernetes.io/name: cm-dir
spec:
  containers:
    - name: reader
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: shorty-runtime
      volumeMounts:
        - name: runtime
          mountPath: /etc/shorty-runtime
          readOnly: true
  volumes:
    - name: runtime
      configMap:
        name: shorty-runtime
---
apiVersion: v1
kind: Pod
metadata:
  name: cm-subpath
  namespace: shorty
  labels:
    app.kubernetes.io/name: cm-subpath
spec:
  containers:
    - name: reader
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: shorty-runtime
      volumeMounts:
        - name: runtime
          mountPath: /etc/shorty-runtime/app.properties
          subPath: app.properties
          readOnly: true
  volumes:
    - name: runtime
      configMap:
        name: shorty-runtime
