apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
  namespace: shorty
  labels:
    app.kubernetes.io/name: secret-reader
spec:
  containers:
    - name: reader
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: shorty-config
      volumeMounts:
        - name: db-secret
          mountPath: /etc/shorty
          readOnly: true
  volumes:
    - name: db-secret
      secret:
        secretName: shorty-db
        defaultMode: 0444
