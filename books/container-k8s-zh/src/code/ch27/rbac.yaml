apiVersion: v1
kind: ServiceAccount
metadata:
  name: shorty-api
  namespace: shorty
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shorty-config-reader
  namespace: shorty
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shorty-config-reader
  namespace: shorty
subjects:
  - kind: ServiceAccount
    name: shorty-api
    namespace: shorty
roleRef:
  kind: Role
  name: shorty-config-reader
  apiGroup: rbac.authorization.k8s.io
