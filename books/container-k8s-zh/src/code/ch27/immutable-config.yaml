apiVersion: v1
kind: ConfigMap
metadata:
  name: shorty-release
  namespace: shorty
data:
  RELEASE: "blue"
immutable: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-demo
  namespace: shorty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: release-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-demo
        release: blue
      annotations:
        checksum/config: blue
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef:
                name: shorty-release
