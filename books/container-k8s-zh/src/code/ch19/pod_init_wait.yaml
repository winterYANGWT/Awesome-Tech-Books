apiVersion: v1
kind: Pod
metadata:
  name: api-waiter
  namespace: shorty
  labels:
    app.kubernetes.io/part-of: shorty
spec:
  initContainers:
    - name: wait-api
      image: busybox:1.37
      # 故意写错 Service 名：api-wrong 不存在，DNS 解析失败，init 容器退出码 1。
      command: ["sh", "-c", "nslookup api-wrong || { echo \"DNS lookup failed for api-wrong\"; exit 1; }"]
  containers:
    - name: api
      image: shorty:0.1
      imagePullPolicy: IfNotPresent
      args: ["serve"]
      ports:
        - name: http
          containerPort: 8080
      envFrom:
        - configMapRef:
            name: shorty-config
