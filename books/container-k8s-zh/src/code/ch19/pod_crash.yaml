apiVersion: v1
kind: Pod
metadata:
  name: api-crash
  namespace: shorty
  labels:
    app.kubernetes.io/part-of: shorty
spec:
  restartPolicy: Always
  containers:
    - name: api
      image: shorty:0.1
      imagePullPolicy: IfNotPresent
      args: ["serve"]
      env:
        - name: SHORTY_LISTEN
          value: ":8080"
        # 进程启动 2 秒后以退出码 1 退出，模拟启动阶段的崩溃。
        - name: SHORTY_FAULT_CRASH_AFTER
          value: "2"
