apiVersion: v1
kind: Pod
metadata:
  name: share-net
  namespace: shorty
  labels:
    app.kubernetes.io/part-of: shorty
spec:
  containers:
    - name: server
      image: busybox:1.37
      command:
        - sh
        - -c
        - >-
          mkdir -p /srv &&
          echo "hello from $(hostname)" > /srv/index.html &&
          exec httpd -f -p 8080 -h /srv
    - name: client
      image: busybox:1.37
      command: ["sh", "-c", "exec sleep 3600"]
