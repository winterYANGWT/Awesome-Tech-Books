apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: shorty
  labels:
    app: api
spec:
  containers:
    - name: api
      image: shorty:0.1
      imagePullPolicy: IfNotPresent
      env:
        - name: SHORTY_LISTEN
          value: ":8080"
      ports:
        - name: http
          containerPort: 8080
