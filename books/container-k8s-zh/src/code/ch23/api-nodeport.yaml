apiVersion: v1
kind: Service
metadata:
  name: api-nodeport
  namespace: shorty
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: shorty
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      # 30080 落在 NodePort 的静态段 30000–30085 里，避免和动态分配冲突。
      nodePort: 30080
