apiVersion: v1
kind: Pod
metadata:
  name: trace-demo
  namespace: shorty
  labels:
    app.kubernetes.io/name: trace-demo
spec:
  containers:
    - name: trace-demo
      image: shorty:0.1
      imagePullPolicy: IfNotPresent
      args: ["serve"]
      ports:
        - name: http
          containerPort: 8080
