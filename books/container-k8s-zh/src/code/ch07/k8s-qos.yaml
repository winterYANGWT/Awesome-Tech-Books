apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
  labels:
    app: ch07-qos
    qos: guaranteed
spec:
  containers:
    - name: app
      image: busybox:1.37
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
  labels:
    app: ch07-qos
    qos: burstable
spec:
  containers:
    - name: app
      image: busybox:1.37
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 50m
          memory: 24Mi
        limits:
          cpu: 100m
          memory: 48Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
  labels:
    app: ch07-qos
    qos: besteffort
spec:
  containers:
    - name: app
      image: busybox:1.37
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
