apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: shorty
  labels:
    app.kubernetes.io/name: node-agent
    app.kubernetes.io/part-of: shorty
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
        app.kubernetes.io/part-of: shorty
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
