apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shorty
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: shorty
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: shorty
    spec:
      containers:
        - name: api
          image: shorty:0.1
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          envFrom:
            - configMapRef:
                name: shorty-config
