apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shortybackups.shorty.example.com
spec:
  group: shorty.example.com
  scope: Namespaced
  names:
    plural: shortybackups
    singular: shortybackup
    kind: ShortyBackup
    shortNames:
      - sb
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Database
          type: string
          jsonPath: .spec.database
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - database
              properties:
                database:
                  type: string
                  enum:
                    - postgres
                  default: postgres
                retentionDays:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 7
                compress:
                  type: boolean
                  description: 是否压缩备份文件。
                  default: false
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
