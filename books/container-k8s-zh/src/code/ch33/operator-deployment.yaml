apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorty-operator
  namespace: shorty
  labels:
    app.kubernetes.io/name: shorty-operator
    app.kubernetes.io/part-of: shorty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shorty-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shorty-operator
        app.kubernetes.io/part-of: shorty
    spec:
      serviceAccountName: shorty-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: shorty-operator:0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              value: shorty
            - name: BACKUP_IMAGE
              value: postgres:18.6-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
