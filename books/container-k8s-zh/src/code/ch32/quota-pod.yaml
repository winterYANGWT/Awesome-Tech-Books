apiVersion: v1
kind: Pod
metadata:
  name: quota-filler
  namespace: shorty
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: filler
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "1800m"
          memory: "32Mi"
        limits:
          cpu: "2"
          memory: "64Mi"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
