apiVersion: v1
kind: Pod
metadata:
  name: kubelet-probe
  namespace: default
spec:
  # 和节点共用网络栈，才能从 127.0.0.1 访问 kubelet；这不是业务 Pod 该有的配置。
  hostNetwork: true
  nodeName: shorty-worker
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
