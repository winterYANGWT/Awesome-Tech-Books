apiVersion: v1
kind: Pod
metadata:
  name: hostpid-in-restricted
  namespace: shorty
spec:
  hostPID: true
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  volumes:
    - name: hostroot
      hostPath:
        path: /
