apiVersion: v1
kind: ConfigMap
metadata:
  name: shorty-web-v2
  namespace: shorty
data:
  index.html: |
    <!doctype html>
    <html lang="zh-CN">
    <head><meta charset="utf-8"><title>Shorty frontend v2</title></head>
    <body><h1>shorty 前端 v2</h1><p>这是灰度版本。</p></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v2
  namespace: shorty
  labels:
    app.kubernetes.io/name: web-v2
    app.kubernetes.io/part-of: shorty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-v2
        app.kubernetes.io/part-of: shorty
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: shorty-web-v2
---
apiVersion: v1
kind: Service
metadata:
  name: web-v2
  namespace: shorty
  labels:
    app.kubernetes.io/name: web-v2
    app.kubernetes.io/part-of: shorty
spec:
  selector:
    app.kubernetes.io/name: web-v2
  ports:
    - name: http
      port: 80
      targetPort: http
