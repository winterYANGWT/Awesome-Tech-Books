apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shorty
  namespace: shorty
spec:
  parentRefs:
    - name: shorty-gw
  hostnames:
    - shorty.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: api
          port: 8080
