apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: shorty
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        # namespaceSelector 和 podSelector 写在同一个 from 元素里，两个条件同时满足。
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
