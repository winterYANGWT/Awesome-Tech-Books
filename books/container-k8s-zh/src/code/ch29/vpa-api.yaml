apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: api-vpa
  namespace: shorty
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: shorty
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: api
        minAllowed:
          cpu: 25m
          memory: 250Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
