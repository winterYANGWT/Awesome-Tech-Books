# 只查行数，用来对照恢复前后。
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-count
  namespace: shorty
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-count
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$(cat /etc/shorty/db_password)"
              echo -n 'links rows: '
              psql -h postgres -U shorty -d shorty -tAc 'SELECT count(*) FROM links'
          volumeMounts:
            - name: db-secret
              mountPath: /etc/shorty
              readOnly: true
      volumes:
        - name: db-secret
          secret:
            secretName: shorty-db
