# 故意引用一个不存在的 StorageClass，观察 Pod 为什么 Pending。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-bad
  namespace: sts-demo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-bad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-bad
    spec:
      containers:
        - name: shell
          image: busybox:1.37
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: does-not-exist
        resources:
          requests:
            storage: 1Gi
