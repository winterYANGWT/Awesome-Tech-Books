# 模拟误操作：把 links 表删掉。
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-drop
  namespace: shorty
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-drop
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$(cat /etc/shorty/db_password)"
              psql -h postgres -U shorty -d shorty -v ON_ERROR_STOP=1 -c 'DROP TABLE links;'
              echo -n 'links table dropped: '
              psql -h postgres -U shorty -d shorty -tAc "SELECT to_regclass('links') IS NULL"
          volumeMounts:
            - name: db-secret
              mountPath: /etc/shorty
              readOnly: true
      volumes:
        - name: db-secret
          secret:
            secretName: shorty-db
