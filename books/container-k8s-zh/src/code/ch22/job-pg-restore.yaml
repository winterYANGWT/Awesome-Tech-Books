# 恢复到新的 data-postgres-0：连 headless Service，目标库是空的。
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-restore
  namespace: shorty
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-restore
    spec:
      restartPolicy: Never
      containers:
        - name: pg-restore
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$(cat /etc/shorty/db_password)"
              pg_restore -h postgres -U shorty -d shorty --no-owner /backup/shorty.dump
              echo -n 'links rows after restore: '
              psql -h postgres -U shorty -d shorty -tAc 'SELECT count(*) FROM links'
          volumeMounts:
            - name: backup
              mountPath: /backup
            - name: db-secret
              mountPath: /etc/shorty
              readOnly: true
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: postgres-backup
        - name: db-secret
          secret:
            secretName: shorty-db
