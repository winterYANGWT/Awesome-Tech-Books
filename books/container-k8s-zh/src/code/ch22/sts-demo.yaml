# 只用于观察 StatefulSet 的身份和顺序，不承载 shorty 的数据。
# 22.4 迁移的是 shorty 命名空间里的 postgres，与这里无关。
apiVersion: v1
kind: Namespace
metadata:
  name: sts-demo
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sts-demo
  labels:
    app.kubernetes.io/name: postgres
spec:
  # headless：没有 ClusterIP，DNS 直接返回 Pod 地址，StatefulSet 才能给每个 Pod 一个域名。
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sts-demo
  labels:
    app.kubernetes.io/name: postgres
spec:
  # 必须指向上面那个 headless Service。
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: shell
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - '[ -f /data/written-by ] || echo initial > /data/written-by; sleep 3600'
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
