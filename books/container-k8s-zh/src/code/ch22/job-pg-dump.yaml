# 通过 Service 连旧库做逻辑备份，写到独立的备份卷。
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-dump
  namespace: shorty
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-dump
    spec:
      restartPolicy: Never
      containers:
        - name: pg-dump
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$(cat /etc/shorty/db_password)"
              pg_dump -h postgres -U shorty -d shorty -Fc -f /backup/shorty.dump
              ls -l /backup/shorty.dump
          volumeMounts:
            - name: backup
              mountPath: /backup
            - name: db-secret
              mountPath: /etc/shorty
              readOnly: true
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: postgres-backup
        - name: db-secret
          secret:
            secretName: shorty-db
