apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sts-demo
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  # 默认是 Retain/Retain。这里显式写出来，删 StatefulSet 时连 PVC 一起删。
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: shell
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - '[ -f /data/written-by ] || echo initial > /data/written-by; sleep 3600'
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
