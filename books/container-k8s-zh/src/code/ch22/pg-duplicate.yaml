# 故意让第二个 postmaster 挂同一份数据目录，观察 StatefulSet 的“至多一个”靠什么兜底。
apiVersion: v1
kind: Pod
metadata:
  name: pg-duplicate
  namespace: shorty
  labels:
    app.kubernetes.io/name: pg-duplicate
spec:
  restartPolicy: Never
  containers:
    - name: postgres
      image: postgres:18.6-alpine
      imagePullPolicy: IfNotPresent
      env:
        - name: POSTGRES_USER
          value: shorty
        - name: POSTGRES_DB
          value: shorty
        - name: POSTGRES_PASSWORD_FILE
          value: /etc/shorty/db_password
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: db-secret
          mountPath: /etc/shorty
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-postgres-0
    - name: db-secret
      secret:
        secretName: shorty-db
