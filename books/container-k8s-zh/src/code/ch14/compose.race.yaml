name: shorty-race

# 这个文件只用于观察“没有 healthcheck 时 depends_on 等什么”：
# postgres 故意延迟 12 秒才启动数据库进程，api 只等容器进程启动，不等数据库可用。
services:
  postgres:
    image: postgres:18.6-alpine
    command: ["sh", "-c", "sleep 12; exec docker-entrypoint.sh postgres"]
    environment:
      POSTGRES_USER: shorty
      POSTGRES_DB: shorty
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    image: shorty:0.1
    environment:
      SHORTY_DB_URL: postgres://shorty@postgres:5432/shorty?sslmode=disable
      SHORTY_DB_PASSWORD_FILE: /run/secrets/db_password
      SHORTY_LISTEN: ":8080"
      SHORTY_LOG_LEVEL: info
    secrets:
      - db_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
    restart: "no"

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
