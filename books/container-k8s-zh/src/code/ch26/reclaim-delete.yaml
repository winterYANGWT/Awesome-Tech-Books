apiVersion: v1
kind: Namespace
metadata:
  name: reclaim-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: delete-pvc
  namespace: reclaim-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: reclaim-delete
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: delete-pod
  namespace: reclaim-demo
spec:
  containers:
    - name: shell
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: delete-pvc
