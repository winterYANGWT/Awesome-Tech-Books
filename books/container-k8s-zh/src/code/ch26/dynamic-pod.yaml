apiVersion: v1
kind: Pod
metadata:
  name: auto-pod
  namespace: dynamic-demo
spec:
  containers:
    - name: shell
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: auto-pvc
