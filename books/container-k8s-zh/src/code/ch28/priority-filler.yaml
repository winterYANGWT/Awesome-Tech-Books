apiVersion: v1
kind: Pod
metadata:
  name: fill-worker2
  namespace: shorty
spec:
  nodeSelector:
    kubernetes.io/hostname: shorty-worker2
  priorityClassName: shorty-low
  terminationGracePeriodSeconds: 15
  containers:
    - name: app
      image: alpine:3.22
      command: ["sh", "-c", "trap '' TERM; sleep 3600"]
      resources:
        requests:
          cpu: __CPU__
