apiVersion: v1
kind: Pod
metadata:
  name: affinity-pending
  namespace: shorty
  labels:
    app.kubernetes.io/name: affinity-pending
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: shorty.example.com/pool
                operator: In
                values: ["api"]
  containers:
    - name: app
      image: alpine:3.22
      command: ["sleep", "3600"]
