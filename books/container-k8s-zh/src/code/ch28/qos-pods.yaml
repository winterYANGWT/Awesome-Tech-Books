apiVersion: v1
kind: Namespace
metadata:
  name: ch28-qos
---
apiVersion: v1
kind: Pod
metadata:
  name: guaranteed
  namespace: ch28-qos
spec:
  containers:
    - name: app
      image: alpine:3.22
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: burstable
  namespace: ch28-qos
spec:
  containers:
    - name: app
      image: alpine:3.22
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: besteffort
  namespace: ch28-qos
spec:
  containers:
    - name: app
      image: alpine:3.22
      command: ["sleep", "3600"]
