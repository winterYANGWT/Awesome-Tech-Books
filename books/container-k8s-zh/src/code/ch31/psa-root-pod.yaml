# 故意保留 root、可提权、没有 seccomp 的 Pod，用来触发 restricted 的拒绝。
apiVersion: v1
kind: Pod
metadata:
  name: psa-root
  namespace: shorty
  labels:
    app: psa-root
spec:
  containers:
    - name: demo
      image: busybox:1.37
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 0
        privileged: true
