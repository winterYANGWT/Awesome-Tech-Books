# 括号没有闭合，这是语法错误；语法错误会让 apiserver 在创建策略时直接拒绝，
# 和上面那条“类型错误只写 status”不同。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: demo-syntax-error
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: "object.metadata.labels["
      message: "syntax error demo"
