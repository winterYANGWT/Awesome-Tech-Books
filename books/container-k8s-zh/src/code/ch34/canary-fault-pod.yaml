apiVersion: v1
kind: Pod
metadata:
  name: canary-fault
  namespace: shorty
  labels:
    app.kubernetes.io/part-of: shorty
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: fault
      image: alpine:3.22
      command:
        - wget
        - -qO-
        - --post-data=x
        - http://api-canary:8080/admin/fault?error_rate=1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
