apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shorty
  namespace: shorty
spec:
  parentRefs:
    - name: shorty-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 8080
          weight: 90
        - name: api-canary
          port: 8080
          weight: 10
