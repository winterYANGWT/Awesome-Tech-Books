apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canary
  namespace: shorty
  labels:
    app.kubernetes.io/name: api-canary
    app.kubernetes.io/part-of: shorty
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-canary
        app.kubernetes.io/part-of: shorty
        track: canary
    spec:
      serviceAccountName: shorty-api
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: localhost:5000/shorty:0.1
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # 和稳定版不同的 base URL，用来在响应里区分请求落到了哪一边。
            - name: SHORTY_BASE_URL
              value: http://canary.shorty
          envFrom:
            - configMapRef:
                name: shorty-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: db-secret
              mountPath: /etc/shorty
              readOnly: true
      volumes:
        - name: db-secret
          secret:
            secretName: shorty-db
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: shorty
  labels:
    app.kubernetes.io/name: api-canary
    app.kubernetes.io/part-of: shorty
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
