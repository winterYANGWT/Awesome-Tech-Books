apiVersion: v1
kind: Namespace
metadata:
  name: shorty
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shorty
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: shorty:0.1
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
