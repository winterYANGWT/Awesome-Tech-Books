apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shorty
spec:
  # 这个字段不存在；Deployment 的副本数字段叫 replicas。
  replicasCount: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: shorty:0.1
          args: ["serve"]
