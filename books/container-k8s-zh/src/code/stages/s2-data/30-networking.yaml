apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shorty
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: shorty
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shorty
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shorty
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shorty
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: shorty
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
