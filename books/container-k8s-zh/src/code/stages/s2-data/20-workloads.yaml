apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: shorty
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shorty
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: shorty
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shorty
spec:
  replicas: 1
  # 单副本 + RWO 卷：先停旧 Pod 再起新 Pod，避免滚动更新时两个 Pod 抢卷。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: shorty
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: shorty
            - name: POSTGRES_DB
              value: shorty
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/shorty/db_password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shorty", "-d", "shorty"]
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: db-secret
              mountPath: /etc/shorty
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: db-secret
          secret:
            secretName: shorty-db
            defaultMode: 0444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shorty
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: shorty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: shorty
    spec:
      containers:
        - name: redis
          image: redis:8.8.4-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shorty
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: shorty
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: shorty
    spec:
      containers:
        - name: api
          image: shorty:0.1
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shorty-config
          volumeMounts:
            - name: db-secret
              mountPath: /etc/shorty
              readOnly: true
      volumes:
        - name: db-secret
          secret:
            secretName: shorty-db
            defaultMode: 0444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shorty
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: shorty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: shorty
    spec:
      containers:
        - name: worker
          image: shorty-worker:0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKER_REDIS_ADDR
              value: "redis:6379"
            - name: WORKER_DB_URL
              value: "postgres://shorty@postgres:5432/shorty?sslmode=disable"
            - name: WORKER_DB_PASSWORD_FILE
              value: /etc/shorty/db_password
            - name: WORKER_CONCURRENCY
              value: "1"
          volumeMounts:
            - name: db-secret
              mountPath: /etc/shorty
              readOnly: true
      volumes:
        - name: db-secret
          secret:
            secretName: shorty-db
            defaultMode: 0444
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shorty-migrate
  namespace: shorty
  labels:
    app.kubernetes.io/name: shorty-migrate
    app.kubernetes.io/part-of: shorty
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shorty-migrate
        app.kubernetes.io/part-of: shorty
    spec:
      restartPolicy: Never
      initContainers:
        # postgres 的 readiness 只说明进程能连；等 Service 真正可解析、可连接后再迁移。
        - name: wait-for-postgres
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U shorty -d shorty; do sleep 1; done
      containers:
        - name: migrate
          image: shorty:0.1
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: shorty-config
          volumeMounts:
            - name: db-secret
              mountPath: /etc/shorty
              readOnly: true
      volumes:
        - name: db-secret
          secret:
            secretName: shorty-db
            defaultMode: 0444
