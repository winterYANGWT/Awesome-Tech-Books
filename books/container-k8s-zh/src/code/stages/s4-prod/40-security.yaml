apiVersion: v1
kind: ServiceAccount
metadata:
  name: shorty-api
  namespace: shorty
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: shorty
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shorty-config-reader
  namespace: shorty
  labels:
    app.kubernetes.io/part-of: shorty
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shorty-api-config-reader
  namespace: shorty
  labels:
    app.kubernetes.io/part-of: shorty
subjects:
  - kind: ServiceAccount
    name: shorty-api
    namespace: shorty
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shorty-config-reader
